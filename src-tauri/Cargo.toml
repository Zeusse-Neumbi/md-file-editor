[package]
name = "md-editor"
version = "0.1.0"
description = "A desktop Markdown editor with live preview"
authors = ["you"]
edition = "2021"

[lib]
name = "md_editor_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
