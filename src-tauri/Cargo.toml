[package]
name = "md-editor"
version = "0.1.0"
description = "A focused desktop Markdown editor with live preview"
authors = ["Neumbi Kemgang Zeusse"]
license = "MIT"
repository = "https://github.com/Zeusse-Neumbi/md-file-editor"
edition = "2024"

[lib]
name = "md_editor_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
